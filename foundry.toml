[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
verbosity = 2
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[invariant]
runs = 256
depth = 128
fail_on_revert = true

[lint]
exclude_lints = ["unsafe-typecast", "unwrapped-modifier-logic", "named-struct-fields"]
